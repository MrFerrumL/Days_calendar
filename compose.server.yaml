name: campus-day
services:
  bot:
    image: campus-day-bot:local
    build: .
    container_name: campus-day-bot
    restart: unless-stopped
    env_file: .env
    environment:
      MINI_APP_HOST: 0.0.0.0
      DATA_DIR: /app/runtime
    volumes:
      - ./runtime:/app/runtime
    networks:
      proxy:
        aliases: [campus-day-bot]
    init: true
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
networks:
  proxy:
    external: true
    name: infocode_default
